name: Alpha candidate checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-candidate:
        description: Build a clean, licensed candidate and retain tested bytes for a release draft
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-candidate:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve repository bytes for fixed-tag download comparisons
        run: git config --global core.autocrlf false

      - name: Check out source without stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node for interface regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Isolate candidate and fallback recording paths
        run: |
          @(
            'BLACKBOX_STATE_DIR=' + (Join-Path $env:RUNNER_TEMP 'blackbox-ci-unused-state')
            'BLACKBOX_CANDIDATE_DIR=' + (Join-Path $env:RUNNER_TEMP 'blackbox-candidate')
            'BLACKBOX_UNPACK_DIR=' + (Join-Path $env:RUNNER_TEMP 'Blackbox candidate 中文')
          ) | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run complete Python regression suite from checkout
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete interface regression suite from checkout
        run: |
          $taskTests = @(Get-ChildItem -LiteralPath tests -Filter 'test_*.cjs' -File | Sort-Object Name | ForEach-Object { $_.FullName })
          if ($taskTests.Count -eq 0) { throw 'No interface tests found.' }
          node --test @taskTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test release tooling without network or publication
        run: |
          python -m unittest discover -s tools/tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # --for-release only checks source cleanliness and licensing. It never
      # attests real-host acceptance or grants permission to publish.
      - name: Build a local candidate
        env:
          BLACKBOX_RELEASE_CANDIDATE: ${{ inputs.release-candidate || false }}
        run: |
          $taskBuildArgs = @('tools/build_alpha.py', '--output-dir', $env:BLACKBOX_CANDIDATE_DIR)
          if ($env:BLACKBOX_RELEASE_CANDIDATE -eq 'true') { $taskBuildArgs += '--for-release' }
          python @taskBuildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify archive and smoke-test the isolated reader
        run: |
          $taskArchives = @(Get-ChildItem -LiteralPath $env:BLACKBOX_CANDIDATE_DIR -Filter '*.zip' -File)
          if ($taskArchives.Count -ne 1) { throw 'Expected exactly one candidate ZIP.' }
          python tools/verify_alpha_candidate.py $taskArchives[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Extract only verified candidate bytes for independent regression
        run: |
          @'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('tools').resolve()))
          from verify_alpha_candidate import verify_archive, extract_verified
          archives = list(Path(os.environ['BLACKBOX_CANDIDATE_DIR']).glob('*.zip'))
          if len(archives) != 1:
              raise SystemExit('Expected exactly one candidate ZIP.')
          manifest, files = verify_archive(archives[0])
          if manifest.get('publish_ready') is not False:
              raise SystemExit('Candidate must not claim publication readiness.')
          if 'LICENSE' not in files and (manifest.get('license_pending') is not True
                  or 'license_pending' not in manifest.get('release_blockers', [])):
              raise SystemExit('Candidate must retain the missing-license publication blocker.')
          extract_verified(files, Path(os.environ['BLACKBOX_UNPACK_DIR']))
          print('Verified candidate extracted; real-host acceptance remains untested.')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Running from this directory catches omitted fixture/helper files; the
      # source checkout must not supply imports missing from the candidate.
      - name: Run complete Python regression suite from the extracted candidate
        run: |
          Set-Location -LiteralPath $env:BLACKBOX_UNPACK_DIR
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run complete interface regression suite from the extracted candidate
        run: |
          Set-Location -LiteralPath $env:BLACKBOX_UNPACK_DIR
          $taskTests = @(Get-ChildItem -LiteralPath tests -Filter 'test_*.cjs' -File | Sort-Object Name | ForEach-Object { $_.FullName })
          if ($taskTests.Count -eq 0) { throw 'No interface tests found in candidate.' }
          node --test @taskTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record the boundary of this CI check
        run: |
          'Offline candidate and isolated reader checks only. No product installation, real Codex capture, upload, or publication was performed.'

      # Preserve exactly the package tested above; the draft job must not rebuild.
      - name: Retain tested release candidate
        if: ${{ inputs.release-candidate && matrix.python == '3.13' }}
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-release-candidate
          path: ${{ env.BLACKBOX_CANDIDATE_DIR }}/*
          if-no-files-found: error
          retention-days: 7
